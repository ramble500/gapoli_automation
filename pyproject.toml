[tool.poetry]
name = "gappoli"
version = "0.1.0"
description = ""
authors = ["."]
readme = "README.md"
package-mode = false

[tool.poetry.scripts]
babel = "automator.babel"
suizoku = "automator.suizoku"

[tool.poetry.dependencies]
python = "^3.12"
opencv-python = "^4.10.0.84"
pillow = "^10.4.0"
pytesseract = "^0.3.13"
imgsim = "^0.1.2"
tqdm = "^4.66.5"
matplotlib = "^3.9.2"
influxdb = "^5.3.2"
python-dotenv = "^1.0.1"
selenium = "^4.25.0"
chromedriver-binary-sync = "^0.2.2"
ultralytics = "^8.3.39"
torch = {version = "^2.5.1+cu121", source = "torch_cu121"}
torchvision = {version = "^0.20.1+cu121", source = "torch_cu121"}
torchaudio = {version = "^2.5.1+cu121", source = "torch_cu121"}
scikit-learn = "^1.6.0"


[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
jupyterlab = "^4.2.5"
jupyter-bbox-widget = "^0.6.0"
ipywidgets = "^8.1.5"
isort = "^6.0.1"


[[tool.poetry.source]]
name = "torch_cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
